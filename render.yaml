services:
  - type: web
    name: agenda-to-bill
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: APP_USERNAME
        value: Simon Granger
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ICLOUD_EMAIL
        sync: false
      - key: ICLOUD_PASSWORD
        sync: false
